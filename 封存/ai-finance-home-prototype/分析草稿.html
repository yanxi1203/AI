<!-- PROTOTYPE: Three iPhone 14 analysis page structures, switchable with ?variant=A|B|C. -->
<main class="app-shell" aria-label="AI 財務管家分析頁架構草稿">
  <section id="screen" class="phone" aria-live="polite"></section>
  <div class="prototype-switcher" aria-label="分析草稿版本切換"><button id="previous" type="button" aria-label="上一個版本">←</button><span id="variant-name"></span><button id="next" type="button" aria-label="下一個版本">→</button></div>
</main>

<style>
  :root { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #202020; background: #ececec; }
  * { box-sizing: border-box; } body { margin: 0; min-height: 100vh; } button { font: inherit; }
  .app-shell { min-height: 100vh; padding: 24px 16px 96px; }.phone { position: relative; width: min(100%, 390px); min-height: 844px; margin: 0 auto; overflow: hidden; border: 2px solid #202020; border-radius: 34px; background: #fff; }
  .ios-status { display:flex; align-items:center; justify-content:space-between; height:39px; padding:8px 28px 0; font-size:12px; font-weight:500; }.ios-notch { width:118px; height:24px; margin-top:-8px; border-radius:0 0 14px 14px; background:#202020; }
  .top { padding:14px 22px 18px; }.date,.muted { color:#666; font-size:12px; }h1,h2,h3,p { margin:0; }h1 { margin-top:7px; font-size:23px; font-weight:500; letter-spacing:-.4px; }h2 { font-size:15px; font-weight:500; }h3 { font-size:14px; font-weight:500; }
  .hero,.insight,.compare-box { margin:0 16px; padding:17px; border:1.5px solid #202020; border-radius:15px; }.hero-label { font-size:13px; font-weight:500; }.amount { margin:10px 0 3px; font-size:31px; font-weight:500; letter-spacing:-.8px; }.hero p,.insight p { margin-top:6px; font-size:14px; line-height:1.5; }.section { padding:19px 22px 0; }.section-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px; }
  .metric-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }.metric { padding:12px; border-top:1px solid #d3d3d3; }.metric strong { display:block; margin-top:6px; font-size:17px; font-weight:500; }.metric span { font-size:12px; color:#666; }.insight strong { font-weight:500; }.category-list { display:grid; gap:13px; }.category-row { display:grid; grid-template-columns:62px 1fr auto; align-items:center; gap:10px; font-size:13px; }.track { height:7px; overflow:hidden; border-radius:5px; background:#dedede; }.track span { display:block; height:100%; background:#202020; }
  .chart-legend { display:flex; gap:14px; padding:0 22px 8px; color:#666; font-size:12px; }.legend-mark { display:inline-block; width:10px; height:10px; margin-right:4px; background:#202020; }.legend-mark.last { background:#cfcfcf; }.bar-chart { padding:0 22px; }.bar-group { padding:12px 0; border-top:1px solid #d3d3d3; }.bar-label { display:flex; justify-content:space-between; margin-bottom:7px; font-size:13px; }.bar-line { display:grid; grid-template-columns:38px 1fr auto; align-items:center; gap:8px; margin-top:5px; color:#666; font-size:11px; }.bar-track { height:9px; overflow:hidden; border-radius:4px; background:#e0e0e0; }.bar-value { height:100%; background:#202020; }.bar-value.last { background:#bdbdbd; }.delta { margin-left:4px; font-weight:500; }
  .advice-list { margin:0 16px; padding:14px 17px; border:1.5px solid #202020; border-radius:15px; }.advice-line { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-top:1px solid #d3d3d3; font-size:13px; }.advice-line:first-of-type { margin-top:9px; }.advice-line strong { font-weight:500; }
  .vertical-chart { display:grid; grid-template-columns:repeat(3,1fr); gap:18px; align-items:end; height:230px; margin:0 22px; padding:13px 10px 0; border-bottom:1px solid #777; }.v-group { display:grid; grid-template-rows:1fr auto; height:100%; text-align:center; }.v-bars { display:flex; align-items:end; justify-content:center; gap:7px; height:174px; }.v-bar { width:23px; min-height:10px; background:#202020; }.v-bar.last { background:#bdbdbd; }.v-label { padding:9px 0 0; font-size:12px; }.v-values { margin-top:3px; color:#666; font-size:10px; }.delta { margin-left:4px; font-weight:500; }
  .pace { margin:0 22px; }.pace-line { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:13px 0; border-top:1px solid #d3d3d3; font-size:14px; }.pace-line strong { text-align:right; font-weight:500; }.today-card { margin:16px; padding:17px; border:1.5px solid #202020; border-radius:15px; }.today-card .amount { font-size:25px; }.bottom-nav { display:flex; justify-content:space-around; margin-top:18px; padding:14px 8px 28px; border-top:1px solid #d3d3d3; color:#666; font-size:11px; }.bottom-nav strong { color:#202020; font-weight:500; }
  .prototype-switcher { position:fixed; bottom:18px; left:50%; display:flex; align-items:center; justify-content:space-between; gap:10px; min-width:245px; transform:translateX(-50%); padding:9px 11px; border-radius:999px; background:#202020; color:#fff; box-shadow:0 5px 18px rgba(0,0,0,.2); font-size:13px; }.prototype-switcher button { width:30px; height:30px; border:1px solid #fff; border-radius:50%; background:transparent; color:#fff; font-size:16px; cursor:pointer; }
  @media (max-width:360px) { .app-shell { padding-inline:8px; }.phone { border-radius:18px; } }
</style>

<script>
  const shell = (content) => `<div class="ios-status"><span>9:41</span><span class="ios-notch" aria-hidden="true"></span><span>●●●</span></div>${content}<nav class="bottom-nav"><span>首頁</span><span>帳本</span><strong>分析</strong><span>設定</span></nav>`;
  const variants = {
    A: { name:'A — 本月狀態', render:() => shell(`<header class="top"><div class="date">分析</div><h1>這個月目前很穩。</h1></header><section class="hero"><div class="hero-label">本月還可使用</div><div class="amount">$ 6,420</div><div class="muted">距離月底還有 14 天</div><p>照目前的速度，這個月仍能維持在預算內。</p></section><section class="section"><div class="section-head"><h2>本月重點</h2><span class="muted">8 月</span></div><div class="metric-grid"><div class="metric"><span>目前支出</span><strong>$8,580</strong></div><div class="metric"><span>比上月</span><strong>− $300</strong></div><div class="metric"><span>最大類別</span><strong>飲食</strong></div><div class="metric"><span>目標存款</span><strong>12%</strong></div></div></section><section class="section"><div class="section-head"><h2>AI 管家觀察</h2></div></section><section class="insight"><strong>你這週飲食花得比較多</strong><p>主要集中在平日午餐與飲料，但娛樂支出比上個月少。</p></section>`) },
    B: { name:'B — 比較＋管家建議（推薦）', render:() => shell(`<header class="top"><div class="date">分析</div><h1>跟上個月差在哪？</h1></header><section class="compare-box"><div class="hero-label">本月總支出</div><div class="amount">$ 8,580</div><div class="muted">比 7 月少了 $300</div></section><section class="section"><div class="section-head"><h2>分類比較</h2><span class="muted">金額</span></div></section><div class="chart-legend"><span><i class="legend-mark"></i>本月</span><span><i class="legend-mark last"></i>上月</span></div><div class="bar-chart"><div class="bar-group"><div class="bar-label"><span>飲食 <strong class="delta">+ $400</strong></span><span>$3,200</span></div><div class="bar-line"><span>本月</span><div class="bar-track"><div class="bar-value" style="width:80%"></div></div><span>$3,200</span></div><div class="bar-line"><span>上月</span><div class="bar-track"><div class="bar-value last" style="width:70%"></div></div><span>$2,800</span></div></div><div class="bar-group"><div class="bar-label"><span>娛樂 <strong class="delta">− $300</strong></span><span>$2,100</span></div><div class="bar-line"><span>本月</span><div class="bar-track"><div class="bar-value" style="width:53%"></div></div><span>$2,100</span></div><div class="bar-line"><span>上月</span><div class="bar-track"><div class="bar-value last" style="width:60%"></div></div><span>$2,400</span></div></div><div class="bar-group"><div class="bar-label"><span>交通 <strong class="delta">− $100</strong></span><span>$1,200</span></div><div class="bar-line"><span>本月</span><div class="bar-track"><div class="bar-value" style="width:30%"></div></div><span>$1,200</span></div><div class="bar-line"><span>上月</span><div class="bar-track"><div class="bar-value last" style="width:33%"></div></div><span>$1,300</span></div></div></div><section class="section"><div class="section-head"><h2>AI 管家建議</h2></div></section><section class="advice-list"><strong>接下來這樣安排就好</strong><div class="advice-line"><span>每天建議可使用</span><strong>$450</strong></div><div class="advice-line"><span>先預留網路費</span><strong>$599</strong></div><div class="advice-line"><span>本月可存入夢想目標</span><strong>$2,000</strong></div></section>`) },
    C: { name:'C — 接下來怎麼花', render:() => shell(`<header class="top"><div class="date">分析</div><h1>接下來 14 天，這樣安排就好。</h1></header><section class="today-card"><div class="hero-label">每天建議可使用</div><div class="amount">$ 450</div><div class="muted">依照本月預算與目前支出估算</div></section><section class="section"><div class="section-head"><h2>接下來的安排</h2></div></section><div class="pace"><div class="pace-line"><span>本月還可使用</span><strong>$6,420</strong></div><div class="pace-line"><span>待繳固定支出</span><strong>− $599</strong></div><div class="pace-line"><span>夢想目標想存</span><strong>− $2,000</strong></div><div class="pace-line"><span>可以自由使用</span><strong>$3,821</strong></div></div><section class="section"><div class="section-head"><h2>AI 管家建議</h2></div></section><section class="insight"><strong>先把網路費留起來</strong><p>剩下的額度仍足夠你日常使用，也能讓英國看雪計畫前進一點。</p></section>`) }
  };
  const keys = Object.keys(variants); let current = new URLSearchParams(location.search).get('variant') || 'B'; if (!variants[current]) current = 'B';
  const render = () => { document.querySelector('#screen').innerHTML = variants[current].render(); document.querySelector('#variant-name').textContent = variants[current].name; history.replaceState(null,'',`?variant=${current}`); };
  const move = (delta) => { current = keys[(keys.indexOf(current)+delta+keys.length)%keys.length]; render(); };
  document.querySelector('#previous').addEventListener('click',()=>move(-1)); document.querySelector('#next').addEventListener('click',()=>move(1)); document.addEventListener('keydown',(event)=>{ if (event.key==='ArrowLeft') move(-1); if (event.key==='ArrowRight') move(1); }); render();
</script>
