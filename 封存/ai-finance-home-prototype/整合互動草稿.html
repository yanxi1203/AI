    const relaxedMonthly = Math.max(500, roundPlanAmount(remaining / 18));
    const fastMonthly = Math.max(1000, roundPlanAmount(remaining / 8));
    return `<section class="goal-estimate" id="goal-estimate-${goalIndex}"><strong>Fin 幫「${goal.name}」整理的規劃示意</strong><p>目前先以目標總額 $${provisionalTarget.toLocaleString()} 試算；後端完成後，會先參考機票、住宿或商品行情，再依你的每月可存金額調整。</p><div class="estimate-plans"><div class="estimate-plan"><span>舒適</span><strong>18 個月</strong><small>每月 $${relaxedMonthly.toLocaleString()}</small></div><div class="estimate-plan selected"><span>平衡</span><strong>${balancedMonths} 個月</strong><small>每月 $${balancedMonthly.toLocaleString()}</small></div><div class="estimate-plan"><span>加速</span><strong>8 個月</strong><small>每月 $${fastMonthly.toLocaleString()}</small></div></div><p class="estimate-source">目前尚未連網，這裡只示範操作流程，不代表現在的實際行情。</p></section>`;
  };
  const openGoalEstimate = goalIndex => {
    selectedGoalEstimate = selectedGoalEstimate === goalIndex ? null : goalIndex;
    renderGoalPage();
    if (selectedGoalEstimate !== null) document.querySelector('#goal-estimate-' + goalIndex)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  };
  const homeDetails = {
    records: () => `<section class="home-records">${recentRecordsMarkup()}</section>`,
    goals: () => `<section class="home-goals"><div class="home-goal-preview-head"><h2>正在進行的目標</h2><button class="home-goal-more" type="button" data-open-goals>查看全部 ${uiIcon('next')}</button></div><div class="home-goal-list">${goalPreviewMarkup()}</div></section>`
  };
  const renderHomeDetail = (view) => {
    document.querySelector('#home-detail').innerHTML = homeDetails[view]();
    document.querySelectorAll('[data-home-view]').forEach(button => button.classList.toggle('selected', button.dataset.homeView === view));
    if (view === 'goals') document.querySelector('[data-open-goals]').addEventListener('click', renderGoalPage);
  };
  const goalPageView = () => `<section class="goal-page"><header class="goal-page-top"><button class="goal-page-back" id="goal-page-back" type="button" aria-label="返回首頁">${uiIcon('back')}</button><div><span>夢想規劃</span><h1>我的夢想目標</h1></div><button class="goal-page-add" type="button" data-add-goal aria-label="新增夢想目標">${uiIcon('plus')}</button></header><section class="goal-page-intro"><div><h2>慢慢完成想做的事</h2><strong>共 ${demoGoals.length} 個</strong></div><p>點選 Fin 估算，就能查看每個目標的時間與每月存款建議。</p></section>${goalCreatedMessage ? `<div class="goal-created">${goalCreatedMessage}</div>` : ''}<div class="home-goal-list">${goalsMarkup()}</div><button class="add-goal" type="button" data-add-goal>${uiIcon('plus')}<span>建立新的夢想目標</span></button><div class="goal-add-help">不知道金額也沒關係，可以先告訴 Fin 你想完成什麼。</div><div id="goal-draft"></div></section>`;
  const renderGoalPage = () => {
    const content = document.querySelector('#content');
    content.innerHTML = goalPageView();
    document.querySelectorAll('[data-page]').forEach(button => button.classList.toggle('active', button.dataset.page === 'home'));
    document.querySelector('#goal-page-back').addEventListener('click', () => renderPage('home', 'goals'));
    document.querySelectorAll('[data-add-goal]').forEach(button => button.addEventListener('click', openGoalDraft));
    document.querySelectorAll('[data-estimate-goal]').forEach(button => button.addEventListener('click', () => openGoalEstimate(Number(button.dataset.estimateGoal))));
    content.scrollTop = 0;
  };
  const renderCarrierPage = (returnPage = 'home') => {
    const content = document.querySelector('#content');
    content.innerHTML = carrierPageView();
    document.querySelectorAll('[data-page]').forEach(button => button.classList.toggle('active', button.dataset.page === returnPage));
    document.querySelector('#carrier-page-back').addEventListener('click', () => renderPage(returnPage));
    content.scrollTop = 0;
  };
  const showButlerResult = (title, message, actions = '') => {
    const result = document.querySelector('#butler-result');
    if (!result) return;
    result.className = 'butler-result is-visible';
    result.innerHTML = '<strong>' + title + '</strong><div>' + message + '</div>' + actions;
  };
  let pendingGoalIdea = null;
  const goalNameFromText = text => {
    if (text.includes('英國') && /雪|旅行|旅遊|玩/.test(text)) return '英國看雪之旅';
    if (text.includes('電腦')) return '新電腦';
    if (text.includes('遊戲主機')) return '遊戲主機';
    const cleaned = text.replace(/我想要|我想|想要|想存錢|想存|夢想是|夢想|目標是|目標|希望可以|希望/g, '').replace(/[，。！？、]/g, '').trim();
    return cleaned.slice(0, 18) || '新的夢想';
  };
  const matchingGoalIndex = idea => demoGoals.findIndex(goal => {
    if (idea.text.includes('英國') && goal.name.includes('英國')) return true;
    if (idea.text.includes('電腦') && goal.name.includes('電腦')) return true;
    if (idea.text.includes('遊戲主機') && goal.name.includes('遊戲主機')) return true;
    return goal.name.includes(idea.name) || idea.name.includes(goal.name);
  });
  const showGoalRecommendation = preference => {
    if (!pendingGoalIdea) return;
    pendingGoalIdea.preference = preference;
    const preferenceText = preference === 'relaxed' ? '每月負擔輕一些' : preference === 'fast' ? '希望快一點完成' : '時間與每月金額保持平衡';
    const existingIndex = matchingGoalIndex(pendingGoalIdea);
    const message = existingIndex >= 0
      ? `你已經有「${demoGoals[existingIndex].name}」了，我建議不要重複建立。可以依照「${preferenceText}」重新看看它的存錢方案。`
      : `我建議先建立「${pendingGoalIdea.name}」，但先不把總額寫死。之後連網查完行情，再依照「${preferenceText}」提供方案，會比較不容易估錯。`;
    showButlerResult('Fin 的建議', message, `<div class="result-actions"><button type="button" class="primary" id="accept-goal-suggestion">${existingIndex >= 0 ? '查看現有目標' : '採用這個建議'}</button><button type="button" id="cancel-goal-suggestion">先不要</button></div>`);
    document.querySelector('#accept-goal-suggestion').addEventListener('click', () => {
      let goalIndex = existingIndex;
      if (goalIndex < 0) {
        demoGoals.push({ name: pendingGoalIdea.name, saved: 0, target: null });
        goalIndex = demoGoals.length - 1;
        goalCreatedMessage = `已採用 Fin 的建議建立「${pendingGoalIdea.name}」。`;
      }
      selectedGoalEstimate = goalIndex;
      pendingGoalIdea = null;
      renderGoalPage();
      document.querySelector('#goal-estimate-' + goalIndex)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    document.querySelector('#cancel-goal-suggestion').addEventListener('click', () => {
      pendingGoalIdea = null;
      resetQuickInput();
      showButlerResult('好的，先不建立', '想再規劃的時候告訴我就好。');
    });
  };
  const startGoalConversation = text => {
    pendingGoalIdea = { text, name: goalNameFromText(text), preference: null };
    const input = document.querySelector('#quick-input');
    if (input) input.value = '';
    showButlerResult('Fin 想先了解一下', `關於「${pendingGoalIdea.name}」，你比較在意哪一件事？`, '<div class="result-actions"><button type="button" id="goal-relaxed">每月輕鬆</button><button type="button" class="primary" id="goal-balanced">Fin 幫我平衡</button><button type="button" id="goal-fast">想快一點</button></div>');
    document.querySelector('#goal-relaxed').addEventListener('click', () => showGoalRecommendation('relaxed'));
    document.querySelector('#goal-balanced').addEventListener('click', () => showGoalRecommendation('balanced'));
    document.querySelector('#goal-fast').addEventListener('click', () => showGoalRecommendation('fast'));
  };
  const keywordRules = [
    { keyword: '遊戲儲值', item: '遊戲儲值', category: '娛樂' },
    { keyword: '參考書', item: '參考書', category: '學習' },
    { keyword: '網路費', item: '網路費', category: '固定支出' },
    { keyword: '電信費', item: '電信費', category: '固定支出' },
    { keyword: '信用卡', item: '信用卡繳費', category: '固定支出' },
    { keyword: '計程車', item: '計程車', category: '交通' },
    { keyword: '零用錢', item: '零用錢', category: '收入' },
    { keyword: '早餐', item: '早餐', category: '飲食' },
    { keyword: '午餐', item: '午餐', category: '飲食' },
    { keyword: '晚餐', item: '晚餐', category: '飲食' },
    { keyword: '飲料', item: '飲料', category: '飲食' },
    { keyword: '咖啡', item: '咖啡', category: '飲食' },
    { keyword: '便當', item: '便當', category: '飲食' },
    { keyword: '公車', item: '公車', category: '交通' },
    { keyword: '捷運', item: '捷運', category: '交通' },
    { keyword: '小說', item: '小說', category: '娛樂' },
    { keyword: '漫畫', item: '漫畫', category: '娛樂' },
    { keyword: '文具', item: '文具', category: '學習' },
    { keyword: '課本', item: '課本', category: '學習' },
    { keyword: '遊戲', item: '遊戲', category: '娛樂' },
    { keyword: '儲值', item: '儲值', category: '娛樂' },
    { keyword: '房租', item: '房租', category: '固定支出' },
    { keyword: '訂閱', item: '訂閱', category: '固定支出' }
  ];
  const keywordMatchesFromText = (text) => {
    const matches = keywordRules
      .map(rule => ({ ...rule, index: text.indexOf(rule.keyword), end: text.indexOf(rule.keyword) + rule.keyword.length }))
      .filter(match => match.index >= 0)
      .sort((a, b) => a.index - b.index || b.keyword.length - a.keyword.length);
    return matches.filter((match, index) => !matches.slice(0, index).some(previous => previous.index <= match.index && previous.end >= match.end));
  };
  const itemsFromText = (text) => keywordMatchesFromText(text).map(match => match.item);
  const itemFromText = (text) => itemsFromText(text)[0] || '這筆消費';
  const categoryFromItem = (item, type) => {
    if (type === 'income') return '收入';
    const rule = keywordRules.find(candidate => candidate.item === item || item.includes(candidate.keyword));
    return rule ? rule.category : '其他';
  };
  const amountsFromText = (text) => Array.from(text.matchAll(/(\d[\d,]*)\s*(?:元|塊)?/g), match => Number(match[1].replaceAll(',', ''))).filter(amount => amount > 0);
  let pendingQuickEntry = null;
  const defaultQuickPlaceholder = '例如：今天午餐花了 110 元';
  const resetQuickInput = () => {
    pendingQuickEntry = null;
    const input = document.querySelector('#quick-input');
    if (!input) return;
    input.value = '';
    input.placeholder = defaultQuickPlaceholder;
  };
  const freeformItemFromText = (text) => {
    const knownItem = itemsFromText(text)[0];
    if (knownItem) return knownItem;
    const cleaned = text
      .replace(/\d[\d,]*/g, '')
      .replace(/今天|昨天|剛剛|大概|差不多|左右|元|塊|花了|花|買了|買|吃了|吃|用了|用|我|是/g, '')
      .replace(/[，。！？、\s]/g, '')
      .trim();
    return cleaned && !/好多錢|很多錢/.test(cleaned) ? cleaned.slice(0, 8) : null;
  };
  const finishDemoEntry = (type, item, amount) => {
    const sign = type === 'income' ? '+' : '−';
    const category = categoryFromItem(item, type);
    demoRecentEntries.unshift({ item, category, amount, type });
    resetQuickInput();
    showButlerResult('Fin 已經記下來了', item + '　' + sign + ' $' + amount.toLocaleString() + '<div class="muted result-meta">' + category + ' · 今天</div>');
    const recordsTab = document.querySelector('[data-home-view="records"]');
    if (recordsTab?.classList.contains('selected')) renderHomeDetail('records');
  };
  const finishMultipleDemo = () => {
    resetQuickInput();
    showButlerResult('Fin 已整理完成', '這些紀錄已經記下來了。');
  };
  const cancelQuickEntry = () => {
    resetQuickInput();
    showButlerResult('好的，先不記', '想起來的時候再告訴我就好。');
  };
  const continuePendingEntry = (text) => {
    if (/算了|先不要|不要記|不記了|取消/.test(text)) {
      cancelQuickEntry();
      return;
    }
    const replyAmounts = amountsFromText(text);
    const replyItem = pendingQuickEntry.type === 'income' ? '本次收入' : freeformItemFromText(text);
    if (replyAmounts.length) pendingQuickEntry.amount = replyAmounts[0];
    if (replyItem) pendingQuickEntry.item = replyItem;
    const input = document.querySelector('#quick-input');
    input.value = '';
    if (!pendingQuickEntry.amount && !pendingQuickEntry.item) {
      input.placeholder = '例如：晚餐 300 元';
      showButlerResult('Fin 還缺一點資訊', '可以直接告訴我花在哪裡和多少錢，例如「晚餐 300 元」。');
      input.focus();
      return;
    }
    if (!pendingQuickEntry.amount) {
      input.placeholder = '例如：300 元';
      showButlerResult('還差金額', pendingQuickEntry.item + '大概花了多少錢呢？');
      input.focus();
      return;
    }
    if (pendingQuickEntry.type === 'expense' && !pendingQuickEntry.item) {
      input.placeholder = '例如：晚餐';
      showButlerResult('還差花費項目', '這 $' + pendingQuickEntry.amount.toLocaleString() + ' 是花在哪裡呢？');
      input.focus();
      return;
    }
    finishDemoEntry(pendingQuickEntry.type, pendingQuickEntry.item, pendingQuickEntry.amount);
  };
  const runQuickInput = () => {
    const input = document.querySelector('#quick-input');
    const text = input.value.trim();
    if (!text) {
      showButlerResult('Fin 在聽', pendingQuickEntry ? '直接補充剛才缺少的資訊就可以。' : '可以告訴我今天花了什麼、收到多少收入，或你想完成的夢想。');
      input.focus();
      return;
    }
    if (pendingQuickEntry) {
      continuePendingEntry(text);
      return;
    }
    const amounts = amountsFromText(text);
    const hasRecordedExpense = amounts.length > 0 && /花了|買了|付了|繳了|儲值了|吃了|幫我記|記帳/.test(text);
    const isGoal = /夢想|目標|想存|想買|想去|希望買|希望去/.test(text) && !hasRecordedExpense;
    const isIncome = /收入|薪水|打工|領了|零用錢/.test(text);
    const isExpense = /花|買|吃|早餐|午餐|晚餐|飲料|公車|捷運|繳|支出|記帳|儲值/.test(text) || keywordMatchesFromText(text).some(match => match.category !== '收入');
    if (isGoal) {
      startGoalConversation(text);
      return;
    }
    if (!isIncome && !isExpense) {
      showButlerResult('Fin 在這裡', '這句比較像一般聊天，所以我不會偷偷記帳。你也可以跟我說花費、收入或夢想。');
      return;
    }
    const type = isIncome ? 'income' : 'expense';
    if (!amounts.length) {
      const knownItem = isIncome ? '本次收入' : itemsFromText(text)[0] || null;
      pendingQuickEntry = { type, item: knownItem, amount: null };
      input.value = '';
      if (isIncome || knownItem) {
        input.placeholder = '例如：300 元';
        showButlerResult('Fin 想再確認一下', (knownItem || '這筆收入') + '大概是多少錢呢？');
      } else {
        input.placeholder = '例如：晚餐 300 元';
        showButlerResult('Fin 想再確認一下', '我知道你今天有一筆花費，但還不知道花在哪裡和多少錢。可以直接回我「晚餐 300 元」。');
      }
      input.focus();
      return;
    }
    const inferredItem = isIncome ? '本次收入' : freeformItemFromText(text);
    if (type === 'expense' && amounts.length === 1 && !inferredItem) {
      pendingQuickEntry = { type, item: null, amount: amounts[0] };
      input.value = '';
      input.placeholder = '例如：晚餐';
      showButlerResult('Fin 還想確認一件事', '這 $' + amounts[0].toLocaleString() + ' 是花在哪裡呢？');
      input.focus();
      return;
    }
    const item = inferredItem || itemFromText(text);
    if (amounts.length > 1) {
      const labels = ['第一筆', '第二筆', '第三筆'];
      const itemNames = itemsFromText(text);
      const summary = amounts.map((amount, index) => (itemNames[index] || labels[index] || '第 ' + (index + 1) + ' 筆') + ' $' + amount.toLocaleString()).join('、');
      showButlerResult('我聽到不只一筆金額', summary + '。要一起記下來嗎？', '<div class="result-actions"><button type="button" class="primary" id="confirm-multiple">確認這些紀錄</button><button type="button" id="cancel-entry">先不要</button></div>');
      document.querySelector('#confirm-multiple').addEventListener('click', finishMultipleDemo);
      document.querySelector('#cancel-entry').addEventListener('click', cancelQuickEntry);
      return;
    }
    finishDemoEntry(type, item, amounts[0]);
  };
  const bindQuickEntry = () => {
    const input = document.querySelector('#quick-input');
    const voiceButton = document.querySelector('#voice-button');
    if (pendingQuickEntry) input.placeholder = pendingQuickEntry.amount ? '例如：晚餐' : pendingQuickEntry.item ? '例如：300 元' : '例如：晚餐 300 元';
    document.querySelector('#entry-add').addEventListener('click', () => input.focus());
    document.querySelector('#send-button').addEventListener('click', runQuickInput);
    input.addEventListener('keydown', event => { if (event.key === 'Enter') runQuickInput(); });
    voiceButton.addEventListener('click', () => {
      voiceButton.classList.add('is-listening');
      voiceButton.textContent = '…';
      showButlerResult('Fin 正在聽……', '這是語音入口的互動示範。');
      window.setTimeout(() => {
        const currentInput = document.querySelector('#quick-input');
        const currentVoiceButton = document.querySelector('#voice-button');
        if (!currentInput || !currentVoiceButton) return;
        currentInput.value = pendingQuickEntry ? (pendingQuickEntry.amount ? '晚餐' : pendingQuickEntry.item ? '300 元' : '晚餐 300 元') : '今天午餐花了 110 元';
        currentVoiceButton.classList.remove('is-listening');
        currentVoiceButton.innerHTML = voiceIconMarkup;
        runQuickInput();
      }, 800);
    });
  };
  let selectedTheme = 'system';
  const applyTheme = (theme) => { selectedTheme = theme; const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches); document.querySelector('.phone').classList.toggle('is-dark', isDark); document.querySelectorAll('[data-theme]').forEach(button => button.classList.toggle('selected', button.dataset.theme === theme)); };
  const renderPage = (page, homeView = 'records') => {
    const content = document.querySelector('#content');
    content.innerHTML = page === 'home' ? home() : page === 'ledger' ? ledgerShell() : page === 'analysis' ? analysis() : settings();
    document.querySelectorAll('[data-page]').forEach(button => button.classList.toggle('active', button.dataset.page === page));
    if (page === 'home') {
      renderHomeDetail(homeView);
      bindQuickEntry();
      document.querySelector('[data-open-carrier]').addEventListener('click', () => renderCarrierPage('home'));
      document.querySelectorAll('[data-home-view]').forEach(button => button.addEventListener('click', () => renderHomeDetail(button.dataset.homeView)));
    }
    if (page === 'ledger') {
      renderLedgerView('overview');
      document.querySelectorAll('[data-view]').forEach(button => button.addEventListener('click', () => renderLedgerView(button.dataset.view)));
      document.querySelector('.ledger-export').addEventListener('click', () => {
        document.querySelector('.ledger-export-note')?.remove();
        document.querySelector('.ledger-hero').insertAdjacentHTML('beforeend', '<div class="ledger-export-note">已準備匯出 8 月 CSV（草稿互動示意）。</div>');
      });
    }
    if (page === 'settings') {
      applyTheme(selectedTheme);
      document.querySelectorAll('[data-theme]').forEach(button => button.addEventListener('click', () => applyTheme(button.dataset.theme)));
      document.querySelector('[data-open-carrier]').addEventListener('click', () => renderCarrierPage('settings'));
    }
    content.scrollTop = 0;
  };
  document.querySelectorAll('[data-page]').forEach(button => button.addEventListener('click', () => renderPage(button.dataset.page)));
  renderPage('home');
</script>
