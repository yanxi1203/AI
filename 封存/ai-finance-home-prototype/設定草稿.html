<!-- PROTOTYPE: Three iPhone 14 settings page structures, switchable with ?variant=A|B|C. -->
<main class="app-shell" aria-label="AI 財務管家設定頁架構草稿">
  <section id="screen" class="phone" aria-live="polite"></section>
  <div class="prototype-switcher" aria-label="設定草稿版本切換"><button id="previous" type="button" aria-label="上一個版本">←</button><span id="variant-name"></span><button id="next" type="button" aria-label="下一個版本">→</button></div>
</main>
<style>
  :root { font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:#202020; background:#ececec; }*{box-sizing:border-box}body{margin:0;min-height:100vh}button{font:inherit}.app-shell{min-height:100vh;padding:24px 16px 96px}.phone{width:min(100%,390px);min-height:844px;margin:0 auto;overflow:hidden;border:2px solid #202020;border-radius:34px;background:#fff}.ios-status{display:flex;align-items:center;justify-content:space-between;height:39px;padding:8px 28px 0;font-size:12px;font-weight:500}.ios-notch{width:118px;height:24px;margin-top:-8px;border-radius:0 0 14px 14px;background:#202020}.top{padding:14px 22px 18px}.date,.muted{color:#666;font-size:12px}h1,h2,h3,p{margin:0}h1{margin-top:7px;font-size:23px;font-weight:500;letter-spacing:-.4px}h2{font-size:15px;font-weight:500}h3{font-size:14px;font-weight:500}.profile,.setting-card,.budget-card{margin:0 16px;padding:17px;border:1.5px solid #202020;border-radius:15px}.profile{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center}.avatar{display:grid;place-items:center;width:52px;height:52px;border:1.5px solid #202020;border-radius:50%;font-size:20px}.profile p{margin-top:4px;color:#666;font-size:13px}.chevron{font-size:18px}.section{padding:20px 22px 0}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}.setting-list{padding:0 22px}.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-top:1px solid #d3d3d3;font-size:14px}.setting-row div{display:grid;gap:4px}.setting-row span{color:#666;font-size:12px}.switch{width:37px;height:21px;border-radius:999px;background:#202020}.switch::after{display:block;width:15px;height:15px;margin:3px 3px 3px auto;border-radius:50%;background:#fff;content:""}.budget-card strong{display:block;margin:7px 0 2px;font-size:25px;font-weight:500}.progress{height:7px;margin-top:12px;overflow:hidden;border-radius:5px;background:#dedede}.progress span{display:block;width:57%;height:100%;background:#202020}.personality-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}.personality{padding:14px;border:1px solid #777;border-radius:12px;font-size:13px}.personality.selected{border:1.5px solid #202020;background:#202020;color:#fff}.personality p{margin-top:5px;font-size:12px;line-height:1.45}.prompt-box{margin:16px;padding:15px;border:1.5px solid #202020;border-radius:15px;font-size:14px;line-height:1.5}.prompt-box strong{display:block;margin-bottom:5px;font-weight:500}.bottom-nav{display:flex;justify-content:space-around;margin-top:18px;padding:14px 8px 28px;border-top:1px solid #d3d3d3;color:#666;font-size:11px}.bottom-nav strong{color:#202020;font-weight:500}.prototype-switcher{position:fixed;bottom:18px;left:50%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:245px;transform:translateX(-50%);padding:9px 11px;border-radius:999px;background:#202020;color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.2);font-size:13px}.prototype-switcher button{width:30px;height:30px;border:1px solid #fff;border-radius:50%;background:transparent;color:#fff;font-size:16px;cursor:pointer}@media(max-width:360px){.app-shell{padding-inline:8px}.phone{border-radius:18px}}
</style>
<script>
  const shell=(content)=>`<div class="ios-status"><span>9:41</span><span class="ios-notch" aria-hidden="true"></span><span>●●●</span></div>${content}<nav class="bottom-nav"><span>首頁</span><span>帳本</span><span>分析</span><strong>設定</strong></nav>`;
  const variants={
    A:{name:'A — 清楚設定清單',render:()=>shell(`<header class="top"><div class="date">設定</div><h1>把它調成你的樣子。</h1></header><section class="profile"><div class="avatar">✦</div><div><h2>小管家</h2><p>溫柔、清楚的提醒方式</p></div><span class="chevron">›</span></section><section class="section"><div class="section-head"><h2>AI 管家</h2></div></section><div class="setting-list"><div class="setting-row"><div><strong>個性與說話方式</strong><span>自訂名稱、語氣與稱呼</span></div><span>›</span></div><div class="setting-row"><div><strong>提醒方式</strong><span>待繳費、預算與夢想目標</span></div><span>›</span></div></div><section class="section"><div class="section-head"><h2>財務設定</h2></div></section><div class="setting-list"><div class="setting-row"><div><strong>每月預算</strong><span>$15,000</span></div><span>›</span></div><div class="setting-row"><div><strong>固定支出</strong><span>網路費、訂閱與其他帳單</span></div><span>›</span></div><div class="setting-row"><div><strong>資料與帳本</strong><span>分類、匯出與重設資料</span></div><span>›</span></div></div>`)},
    B:{name:'B — 先設定管家',render:()=>shell(`<header class="top"><div class="date">設定</div><h1>今天想讓管家怎麼陪你？</h1></header><section class="profile"><div class="avatar">✦</div><div><h2>小管家</h2><p>你可以隨時替它換名字與感覺</p></div><span class="chevron">›</span></section><section class="section"><div class="section-head"><h2>管家的陪伴方式</h2></div></section><div class="personality-grid"><div class="personality selected"><strong>溫柔陪伴</strong><p>提醒但不催促，適合慢慢整理生活。</p></div><div class="personality"><strong>俐落直接</strong><p>重點先說，幫你快速做決定。</p></div><div class="personality"><strong>朋友聊天</strong><p>比較自然、輕鬆的日常語氣。</p></div><div class="personality"><strong>自己定義</strong><p>輸入你喜歡的說話方式。</p></div></div><section class="section"><div class="section-head"><h2>管理財務</h2></div></section><div class="setting-list"><div class="setting-row"><div><strong>每月預算</strong><span>$15,000</span></div><span>›</span></div><div class="setting-row"><div><strong>固定支出</strong><span>3 個項目正在追蹤</span></div><span>›</span></div></div>`)},
    C:{name:'C — 生活與財務',render:()=>shell(`<header class="top"><div class="date">設定</div><h1>先把生活安排好。</h1></header><section class="budget-card"><span class="muted">本月預算</span><strong>$15,000</strong><span class="muted">已使用 $8,580</span><div class="progress"><span></span></div></section><section class="section"><div class="section-head"><h2>正在管理的事情</h2></div></section><div class="setting-list"><div class="setting-row"><div><strong>固定支出</strong><span>網路費 $599 · 每月 15 日</span></div><span>›</span></div><div class="setting-row"><div><strong>夢想目標</strong><span>英國看雪之旅 · 12%</span></div><span>›</span></div></div><section class="section"><div class="section-head"><h2>管家設定</h2></div></section><section class="prompt-box"><strong>小管家</strong>現在用溫柔陪伴的方式提醒你。你可以隨時換名稱、個性與提醒頻率。</section><div class="setting-list"><div class="setting-row"><div><strong>開啟待繳費提醒</strong><span>在到期前提醒我</span></div><span class="switch" aria-label="已開啟"></span></div><div class="setting-row"><div><strong>資料與帳本</strong><span>分類、匯出與重設資料</span></div><span>›</span></div></div>`)}
  };const keys=Object.keys(variants);let current=new URLSearchParams(location.search).get('variant')||'A';if(!variants[current])current='A';const render=()=>{document.querySelector('#screen').innerHTML=variants[current].render();document.querySelector('#variant-name').textContent=variants[current].name;history.replaceState(null,'',`?variant=${current}`)};const move=(delta)=>{current=keys[(keys.indexOf(current)+delta+keys.length)%keys.length];render()};document.querySelector('#previous').addEventListener('click',()=>move(-1));document.querySelector('#next').addEventListener('click',()=>move(1));document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft')move(-1);if(event.key==='ArrowRight')move(1)});render();
</script>
