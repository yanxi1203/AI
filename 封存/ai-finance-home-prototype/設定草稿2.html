<!-- PROTOTYPE: Three broader settings architectures, switchable with ?variant=D|E|F. -->
<main class="app-shell" aria-label="AI 財務管家設定頁第二輪草稿">
  <section id="screen" class="phone" aria-live="polite"></section>
  <div class="prototype-switcher" aria-label="設定草稿版本切換"><button id="previous" type="button" aria-label="上一個版本">←</button><span id="variant-name"></span><button id="next" type="button" aria-label="下一個版本">→</button></div>
</main>
<style>
  :root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#202020;background:#ececec}*{box-sizing:border-box}body{margin:0;min-height:100vh}button{font:inherit}.app-shell{min-height:100vh;padding:24px 16px 96px}.phone{width:min(100%,390px);min-height:844px;margin:0 auto;overflow:hidden;border:2px solid #202020;border-radius:34px;background:#fff}.ios-status{display:flex;align-items:center;justify-content:space-between;height:39px;padding:8px 28px 0;font-size:12px;font-weight:500}.ios-notch{width:118px;height:24px;margin-top:-8px;border-radius:0 0 14px 14px;background:#202020}.top{padding:14px 22px 18px}.date,.muted{color:#666;font-size:12px}h1,h2,h3,p{margin:0}h1{margin-top:7px;font-size:23px;font-weight:500;letter-spacing:-.4px}h2{font-size:15px;font-weight:500}h3{font-size:14px;font-weight:500}.section{padding:18px 22px 0}.section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}.setting-list{padding:0 22px}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-top:1px solid #d3d3d3;font-size:14px}.setting-row div{display:grid;gap:4px}.setting-row span{color:#666;font-size:12px}.chevron{font-size:18px}.tile-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}.tile{min-height:114px;padding:15px;border:1.5px solid #202020;border-radius:14px}.tile p{margin-top:7px;color:#666;font-size:12px;line-height:1.45}.tile .mark{display:block;margin-bottom:8px;font-size:16px}.summary{margin:0 16px;padding:16px;border:1.5px solid #202020;border-radius:15px}.summary strong{display:block;margin:7px 0 3px;font-size:25px;font-weight:500}.summary p{color:#666;font-size:13px;line-height:1.45}.rule{margin:0 16px;padding:15px;border:1.5px solid #202020;border-radius:15px}.rule p{margin-top:5px;color:#666;font-size:13px;line-height:1.45}.switch{width:37px;height:21px;border-radius:999px;background:#202020}.switch::after{display:block;width:15px;height:15px;margin:3px 3px 3px auto;border-radius:50%;background:#fff;content:""}.bottom-nav{display:flex;justify-content:space-around;margin-top:18px;padding:14px 8px 28px;border-top:1px solid #d3d3d3;color:#666;font-size:11px}.bottom-nav strong{color:#202020;font-weight:500}.prototype-switcher{position:fixed;bottom:18px;left:50%;display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:245px;transform:translateX(-50%);padding:9px 11px;border-radius:999px;background:#202020;color:#fff;box-shadow:0 5px 18px rgba(0,0,0,.2);font-size:13px}.prototype-switcher button{width:30px;height:30px;border:1px solid #fff;border-radius:50%;background:transparent;color:#fff;font-size:16px;cursor:pointer}@media(max-width:360px){.app-shell{padding-inline:8px}.phone{border-radius:18px}}
</style>
<script>
  const shell=(content)=>`<div class="ios-status"><span>9:41</span><span class="ios-notch" aria-hidden="true"></span><span>●●●</span></div>${content}<nav class="bottom-nav"><span>首頁</span><span>帳本</span><span>分析</span><strong>設定</strong></nav>`;
  const variants={
    D:{name:'D — 全部控制中心',render:()=>shell(`<header class="top"><div class="date">設定</div><h1>管理你的使用方式。</h1></header><div class="tile-grid"><section class="tile"><span class="mark">✦</span><h3>AI 管家</h3><p>個性、名稱、聊天與提醒語氣</p></section><section class="tile"><span class="mark">$</span><h3>記帳與預算</h3><p>分類、月預算、收入與支出規則</p></section><section class="tile"><span class="mark">◷</span><h3>提醒與固定支出</h3><p>帳單、到期日、提醒時間</p></section><section class="tile"><span class="mark">□</span><h3>資料與隱私</h3><p>匯出、備份、刪除與使用說明</p></section></div><section class="section"><div class="section-head"><h2>目前狀態</h2></div></section><div class="setting-list"><div class="setting-row"><div><strong>本月預算</strong><span>$15,000 · 已使用 57%</span></div><span class="chevron">›</span></div><div class="setting-row"><div><strong>固定支出提醒</strong><span>3 個項目正在追蹤</span></div><span class="chevron">›</span></div></div>`)},
    E:{name:'E — 財務規則優先',render:()=>shell(`<header class="top"><div class="date">設定</div><h1>讓記帳符合你的生活。</h1></header><section class="summary"><span class="muted">目前每月預算</span><strong>$15,000</strong><p>你可以依收入、零用錢或生活費調整；不需要一次設定得很完美。</p></section><section class="section"><div class="section-head"><h2>你的財務規則</h2></div></section><div class="setting-list"><div class="setting-row"><div><strong>記帳分類</strong><span>飲食、交通、娛樂與自訂分類</span></div><span class="chevron">›</span></div><div class="setting-row"><div><strong>固定支出</strong><span>網路費、訂閱與繳費日</span></div><span class="chevron">›</span></div><div class="setting-row"><div><strong>夢想目標</strong><span>存錢方式與目標優先順序</span></div><span class="chevron">›</span></div><div class="setting-row"><div><strong>提醒規則</strong><span>接近預算、待繳費與存錢提醒</span></div><span class="chevron">›</span></div></div><section class="section"><div class="section-head"><h2>APP 偏好</h2></div></section><div class="setting-list"><div class="setting-row"><div><strong>AI 管家</strong><span>名稱、個性與回覆方式</span></div><span class="chevron">›</span></div></div>`)},
    F:{name:'F — 個人帳戶中心',render:()=>shell(`<header class="top"><div class="date">設定</div><h1>這是你的財務空間。</h1></header><section class="rule"><h2>小管家正在幫你追蹤</h2><p>本月預算、3 筆固定支出、英國看雪之旅，以及你想收到的提醒。</p></section><section class="section"><div class="section-head"><h2>我的偏好</h2></div></section><div class="setting-list"><div class="setting-row"><div><strong>顯示與介面</strong><span>深淺色、金額顯示與首頁內容</span></div><span class="chevron">›</span></div><div class="setting-row"><div><strong>通知與提醒</strong><span>待繳費、每日摘要與預算提醒</span></div><span class="switch"></span></div><div class="setting-row"><div><strong>AI 管家</strong><span>名稱、個性與自訂說話方式</span></div><span class="chevron">›</span></div></div><section class="section"><div class="section-head"><h2>我的資料</h2></div></section><div class="setting-list"><div class="setting-row"><div><strong>帳本與分類</strong><span>交易紀錄、分類與夢想目標</span></div><span class="chevron">›</span></div><div class="setting-row"><div><strong>資料備份與匯出</strong><span>保留一份自己的紀錄</span></div><span class="chevron">›</span></div><div class="setting-row"><div><strong>隱私與使用說明</strong><span>資料如何儲存與使用</span></div><span class="chevron">›</span></div></div>`)}}
  ;const keys=Object.keys(variants);let current=new URLSearchParams(location.search).get('variant')||'D';if(!variants[current])current='D';const render=()=>{document.querySelector('#screen').innerHTML=variants[current].render();document.querySelector('#variant-name').textContent=variants[current].name;history.replaceState(null,'',`?variant=${current}`)};const move=(delta)=>{current=keys[(keys.indexOf(current)+delta+keys.length)%keys.length];render()};document.querySelector('#previous').addEventListener('click',()=>move(-1));document.querySelector('#next').addEventListener('click',()=>move(1));document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft')move(-1);if(event.key==='ArrowRight')move(1)});render();
</script>
